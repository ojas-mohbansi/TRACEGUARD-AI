[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modbus-nids"
version = "0.4.1"
description = "Hybrid Modbus/TCP network intrusion detection system (Phase 2.1: Tier-1 deterministic protocol FSM)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "FSM-NIDS" }]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
modbus-nids = "modbus_nids.cli:main"

[tool.setuptools]
packages = ["modbus_nids"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
