version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: traceguard-db
    restart: always
    environment:
      POSTGRES_USER: traceguard
      POSTGRES_PASSWORD: secure_traceguard_password
      POSTGRES_DB: traceguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traceguard-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://traceguard:secure_traceguard_password@db:5432/traceguard
      - SECRET_KEY=production-secure-jwt-token-secret-replace-in-env
      - ENVIRONMENT=production
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - ./uploaded_datasets:/app/uploaded_datasets

volumes:
  postgres_data:
